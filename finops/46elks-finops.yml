meters:
- name: sms_parts
  description: Outbound SMS message parts, billed per part per destination.
  unit: message_parts
  aggregation: sum
  dimensions:
  - account
  - destination
- name: inbound_sms
  description: Inbound SMS received on rented numbers.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - number
- name: mms_messages
  description: MMS picture messages sent.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - destination
- name: voice_minutes
  description: Inbound and outbound voice call minutes, billed per minute per destination.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - destination
- name: forwarding_minutes
  description: SIP and WebSocket call-forwarding minutes.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - transport
- name: number_rental
  description: Monthly rental of virtual phone numbers.
  unit: numbers
  aggregation: sum
  dimensions:
  - account
  - country
- name: channel_rental
  description: Monthly rental of extra call channels and user accounts.
  unit: channels
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Inspect per-message and per-call cost fields (in 10,000ths of currency) via the /sms, /mms, and /calls history endpoints.
- name: Allocation
  description: Use subaccounts and per-number tagging to map spend to teams, apps, or customers.
- name: Optimization
  description: Collapse multi-part messages, prefer GSM over UTF-16 to reduce parts, release idle numbers, and choose SIP forwarding where cheaper.
- name: Accountability
  description: Monitor the prepaid balance and set alerts; review monthly SMS/voice/number spend against budget.
