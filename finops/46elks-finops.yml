description: >-
  FinOps view of 46elks spend. 46elks bills usage-based per-message-part rates for
  SMS, per-message rates for MMS, per-minute rates for inbound/outbound voice and
  SIP/WebSocket forwarding, and recurring monthly rents for virtual phone numbers,
  extra call channels, and user accounts. Billing is prepaid against an account
  balance in the account currency (EUR headline).
notes: >-
  Per-destination SMS and voice rates vary; verify against the 46elks pricing page
  during reconciliation. Costs in API responses are expressed in 10,000ths of the
  account currency.
sources:
- https://46elks.com/pricing
