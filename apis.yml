    type: OpenAPI
  - url: collections/46elks.postman_collection.json
    type: PostmanCollection
  - url: collections/46elks.opencollection.json
    type: OpenCollection
  description: Make and receive programmable voice calls. POST to /calls with from,
    to, and voice_start driving JSON call actions (connect, play, ivr, record, hangup)
    delivered via webhook, plus whenhangup callbacks. GET /calls and /calls/{id} retrieve
    call history.
