    type: OpenAPI
  - url: collections/46elks.postman_collection.json
    type: PostmanCollection
  - url: collections/46elks.opencollection.json
    type: OpenCollection
  description: Send picture messages (MMS) to mobile phones. POST to /mms with from,
    to, message, and image data, and GET /mms and /mms/{id} to retrieve MMS history.
- aid: 46elks:46elks-voice-calls-api
  name: 46elks Voice Calls API
  tags:
