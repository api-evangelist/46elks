aid: 46elks
url: https://raw.githubusercontent.com/api-evangelist/46elks/refs/heads/main/apis.yml
name: 46elks
kind: company
description: 46elks is a Swedish communications platform as a service (CPaaS) offering
  a simple HTTP REST API for sending and receiving SMS and MMS, making and receiving
  voice calls with programmable call actions, provisioning virtual phone numbers,
  and handling media and recordings. The API uses HTTP Basic authentication with an
  API username and password, and is billed pay-as-you-go.
