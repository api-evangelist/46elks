    type: OpenAPI
  - url: collections/46elks.postman_collection.json
    type: PostmanCollection
  - url: collections/46elks.opencollection.json
    type: OpenCollection
  description: Send and receive text messages worldwide. POST to /sms with from, to,
    and message, with support for delivery reports (whendelivered webhook), dry runs,
    flash SMS, and alphanumeric sender IDs. GET /sms and /sms/{id} retrieve message
    history.
- aid: 46elks:46elks-mms-api
  name: 46elks MMS API
